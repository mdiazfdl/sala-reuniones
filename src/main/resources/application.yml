spring:
  application:
    name: sala-reuniones

  datasource:
    # Por defecto H2 en memoria (modo PostgreSQL). Para PostgreSQL usar el perfil "postgres".
    url: jdbc:h2:mem:salas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 100

  # Usuario para HTTP Basic (crear y cancelar). Sobrescribible con variables de entorno.
  security:
    user:
      name: ${APP_USER:admin}
      password: ${APP_PASSWORD:admin123}

server:
  port: 8080
